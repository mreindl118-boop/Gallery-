appId: app.gallerylab.desktop
productName: galleryLAB
copyright: Copyright © 2026 galleryLAB
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,test,tests,__tests__,docs,example,examples}'
  - '!**/node_modules/ffmpeg-static/{install.js,example.js}'
# ffprobe-static ships every platform's binary (about 350 MB); each platform section below keeps only
# its own (the folders are win32/darwin/linux, not the ${os} macro). The object form matters: a platform
# section's plain-string patterns reach electron-builder's node_modules matcher as exclusions only.
# Native binaries must live outside the asar archive.
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/exiftool-vendored*/**'
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/onnxruntime-node/**'
  # ffmpeg/ffprobe are run as child processes, which needs real files on disk.
  - '**/node_modules/ffmpeg-static/**'
  - '**/node_modules/ffprobe-static/**'
  - '**/*.node'
# Update feed: this repository's GitHub Releases (the repo must be public). electron-builder
# writes app-update.yml into the app and latest.yml + a blockmap next to the installer.
# Must match RELEASES_REPO in src/shared/release.ts.
publish:
  provider: github
  owner: mreindl118-boop
  repo: Gallery-
  releaseType: release
# Electron fuses, flipped at package time. Node-as-runtime tricks are off, and only the
# integrity-checked app.asar can load. --inspect stays honored because Playwright drives the
# packaged build through it in CI (it needs local code execution to use anyway).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableNodeCliInspectArguments: true
npmRebuild: true
nodeGypRebuild: false
win:
  icon: build/icon.png
  files:
    - from: .
      filter:
        - '!**/node_modules/ffprobe-static/bin/**'
        - '**/node_modules/ffprobe-static/bin/win32/${arch}/**'
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}-${target}.${ext}
nsis:
  oneClick: false
  perMachine: false
  # Per-user only: no "anyone who uses this computer" choice, no UAC for installs or updates.
  allowElevation: false
  include: build/installer.nsh
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: galleryLAB
  uninstallDisplayName: galleryLAB
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  icon: build/icon.png
  files:
    - from: .
      filter:
        - '!**/node_modules/ffprobe-static/bin/**'
        - '**/node_modules/ffprobe-static/bin/darwin/${arch}/**'
  target: [dmg]
  category: public.app-category.photography
linux:
  icon: build/icon.png
  files:
    - from: .
      filter:
        - '!**/node_modules/ffprobe-static/bin/**'
        - '**/node_modules/ffprobe-static/bin/linux/${arch}/**'
  target: [dir]
  category: Graphics
