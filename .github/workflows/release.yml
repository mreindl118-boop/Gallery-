name: Release

# Builds the Windows installer and portable exe from a committed sha, verifies
# them on clean Windows runners (install, launch, uninstall, portable start,
# and a full auto-update in place), then publishes them with their update
# feeds to the public releases repository mreindl118-boop/galleryLAB-releases.
# Start it with a tag push (v0.1.1) or from the Actions tab.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (must match package.json), e.g. 0.1.1'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASES_REPO: mreindl118-boop/galleryLAB-releases

jobs:
  build:
    name: Build and verify (Windows x64)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      VERSION_INPUT: ${{ github.event.inputs.version }}
      REF_NAME: ${{ github.ref_name }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve and check the version
        id: version
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:EVENT_NAME -eq 'push') { $v = $env:REF_NAME -replace '^v', '' } else { $v = $env:VERSION_INPUT.Trim() -replace '^v', '' }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Not a version: '$v'" }
          if ($v -ne $pkg) { throw "Version $v does not match package.json ($pkg). Bump package.json first." }
          if (-not (Test-Path ".github/release-notes/v$v.md")) { throw "Missing release notes: .github/release-notes/v$v.md" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing v$v from $env:GITHUB_SHA"

      - name: Check the releases repository can be published to
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            throw 'The RELEASES_TOKEN secret is not set. Add a fine-grained token with Contents: read and write on mreindl118-boop/galleryLAB-releases as an Actions secret named RELEASES_TOKEN.'
          }
          $repo = gh api "repos/$env:RELEASES_REPO" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "RELEASES_TOKEN cannot see $env:RELEASES_REPO. Create the repository (public, with a README) and give the token access to it." }
          if ($repo.private) { throw "$env:RELEASES_REPO is private; installed apps could not download updates from it. Make it public." }
          Write-Host "Publishing to $env:RELEASES_REPO (default branch $($repo.default_branch))"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Package (NSIS installer + portable)
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Update feeds and checksums
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          node scripts/portable-feed.mjs "dist/galleryLAB-$v-portable.exe" dist
          if ($LASTEXITCODE -ne 0) { throw 'portable feed failed' }
          foreach ($f in @('latest.yml', "galleryLAB-$v-setup.exe.blockmap")) {
            if (-not (Test-Path "dist/$f")) { throw "electron-builder did not write dist/$f" }
          }
          $files = @("dist/galleryLAB-$v-setup.exe", "dist/galleryLAB-$v-portable.exe")
          $lines = foreach ($f in $files) { $h = Get-FileHash $f -Algorithm SHA256; "$($h.Hash.ToLower())  $(Split-Path $f -Leaf)" }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/latest.yml
          Get-Content dist/latest-portable.json
          Get-Content dist/SHA256SUMS.txt

      - name: Smoke test the unpacked build
        shell: pwsh
        run: |
          $env:GALLERYLAB_EXECUTABLE = (Resolve-Path dist/win-unpacked/galleryLAB.exe).Path
          npx playwright test smoke

      - name: Install silently, launch the installed app, uninstall
        shell: pwsh
        run: |
          $setup = Get-Item "dist/galleryLAB-${{ steps.version.outputs.version }}-setup.exe"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'galleryLAB.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw 'Installed executable not found under %LOCALAPPDATA%\Programs' }
          Write-Host "Installed at $exe"
          $env:GALLERYLAB_EXECUTABLE = $exe
          npx playwright test smoke
          if ($LASTEXITCODE -ne 0) { throw 'Smoke test of the installed app failed' }
          $uninstaller = Get-ChildItem (Split-Path $exe) -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Uninstaller not found next to the installed app' }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $exe) { throw 'Uninstall left the app behind' }

      - name: Launch the portable build
        shell: pwsh
        run: |
          $portable = Get-Item "dist/galleryLAB-${{ steps.version.outputs.version }}-portable.exe"
          $env:GALLERYLAB_USER_DATA = Join-Path $env:RUNNER_TEMP 'portable-ud'
          $env:GALLERYLAB_HIDDEN = '1'
          $env:GALLERYLAB_UPDATE_CHECK_DELAY_MS = '3600000'
          Start-Process -FilePath $portable.FullName
          $deadline = (Get-Date).AddSeconds(90)
          do {
            Start-Sleep -Seconds 3
            $running = Get-Process -Name 'galleryLAB' -ErrorAction SilentlyContinue
            $started = Test-Path (Join-Path $env:GALLERYLAB_USER_DATA 'Local State')
          } until (($running -and $started) -or (Get-Date) -gt $deadline)
          if (-not ($running -and $started)) { throw 'Portable build did not start' }
          Get-Process -Name 'galleryLAB' | Stop-Process -Force

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/galleryLAB-${{ steps.version.outputs.version }}-setup.exe
            dist/galleryLAB-${{ steps.version.outputs.version }}-setup.exe.blockmap
            dist/galleryLAB-${{ steps.version.outputs.version }}-portable.exe
            dist/latest.yml
            dist/latest-portable.json
            dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-e2e-results
          path: test-results/

  update-test:
    name: Auto-update in place (Windows x64)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Build a newer throwaway release to update to
        shell: pwsh
        run: ./scripts/ci/build-newer.ps1 -Version 99.0.0 -Out dist-new
      - name: Update the release build in place (installer, manual upgrade, portable)
        shell: pwsh
        run: ./scripts/ci/update-test.ps1 -OldDist dist -OldVersion '${{ needs.build.outputs.version }}' -NewDist dist-new -NewVersion 99.0.0

  publish:
    name: Publish to galleryLAB-releases
    needs: [build, update-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Create or update the public release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          assets=(
            "dist/galleryLAB-$VERSION-setup.exe"
            "dist/galleryLAB-$VERSION-setup.exe.blockmap"
            "dist/galleryLAB-$VERSION-portable.exe"
            dist/latest.yml
            dist/latest-portable.json
            dist/SHA256SUMS.txt
          )
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$tag" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release $tag exists; replacing its assets"
            gh release upload "$tag" "${assets[@]}" --repo "$RELEASES_REPO" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$RELEASES_REPO" \
              --title "galleryLAB $VERSION" --notes-file ".github/release-notes/$tag.md" "${flags[@]}"
          fi
          echo "Published https://github.com/$RELEASES_REPO/releases/tag/$tag"
